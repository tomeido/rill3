name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked

  database:
    name: Fresh migrations and SQLx offline metadata
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rill3_ci
          POSTGRES_USER: rill3
          POSTGRES_PASSWORD: rill3-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rill3 -d rill3_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rill3:rill3-ci-only@localhost:5432/rill3_ci
      RILL3_TEST_DATABASE_URL: postgres://rill3:rill3-ci-only@localhost:5432/rill3_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - name: Apply migrations to a fresh database
        run: cargo sqlx migrate run --source migrations
      - name: Run PostgreSQL integration tests
        # Provider-wide stale marking and directory assertions share this database.
        run: cargo test -p rill3-db --test postgres --locked -- --test-threads=1
      - name: Check committed SQLx query metadata
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Compile without a live database
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets --locked

  operations:
    name: Compose and browser budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Validate shared-host Compose configuration
        env:
          RILL3_PUBLIC_ORIGIN: https://domeido.asuscomm.com
          RILL3_TWITCH_PARENT: domeido.asuscomm.com
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose -f deploy/compose.selfhost.yml config --quiet
      - name: Check browser budgets
        run: bash tests/check-budgets.sh
